name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-analyze:
    name: Mobile / Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/
      - run: dart analyze --fatal-infos

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.9.0
      - name: Validate all OpenSpec changes and specs
        run: openspec validate --all --strict --no-interactive

  mobile-test:
    name: Mobile / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
      - run: flutter pub get
      - run: flutter test --test-randomize-ordering-seed random

  mobile-build:
    name: Mobile / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug

  server:
    name: Server / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test server
        working-directory: apps/server
        run: ./gradlew clean build --no-build-cache

  server-container:
    name: Server / Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build --tag mirrorline-server:ci apps/server
      - name: Verify non-root runtime image
        run: |
          test "$(docker image inspect mirrorline-server:ci --format '{{.Config.User}}')" = "mirrorline"
          docker run --rm --entrypoint /bin/sh mirrorline-server:ci \
            -c 'test "$(id -u)" -ne 0 && test -r /app/app.jar'

  infrastructure:
    name: Infrastructure / Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate VPS Compose model
        working-directory: infra/vps
        env:
          MIRRORLINE_DOMAIN: mirrorline.example.test
          POSTGRES_DB: mirrorline
          POSTGRES_USER: mirrorline
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config --quiet
