name: mirrorline
description: "Serverless, end-to-end encrypted call and SMS synchronization between two phones."

publish_to: 'none'

version: 0.3.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Security
  cryptography: ^2.7.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.0.0

  # Network / discovery
  web_socket_channel: ^3.0.3

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Notifications
  flutter_local_notifications: ^22.2.0

  # Telephony bridge (SMS/call events)
  # telephony: ^0.2.0  # REMOVED: incompatible with modern AGP namespace requirement.

  # Battery optimization opt-out
  android_intent_plus: ^6.1.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Logging
  logger: ^2.3.0

  # Path utilities
  path: ^1.9.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Permissions
  permission_handler: ^13.0.0

  # Device info
  device_info_plus: ^13.2.0

  # UUID
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.1
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
